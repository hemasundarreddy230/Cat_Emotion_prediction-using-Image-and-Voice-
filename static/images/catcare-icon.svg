<svg width="50" height="50" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the cat -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="25" cy="25" r="23" fill="url(#iconGradient)" filter="url(#iconGlow)"/>
  
  <!-- Cat design -->
  <g transform="translate(25, 25)">
    <!-- Cat head -->
    <circle cx="0" cy="-3" r="8" fill="white" opacity="0.9"/>
    
    <!-- Cat ears -->
    <path d="M-6 -8 L-4 -12 L-2 -8 Z" fill="white" opacity="0.9"/>
    <path d="M2 -8 L4 -12 L6 -8 Z" fill="white" opacity="0.9"/>
    
    <!-- Inner ears -->
    <path d="M-5 -8 L-4 -10 L-3 -8 Z" fill="#FF6B9D"/>
    <path d="M3 -8 L4 -10 L5 -8 Z" fill="#FF6B9D"/>
    
    <!-- Cat eyes -->
    <circle cx="-3" cy="-4" r="1.2" fill="#667EEA"/>
    <circle cx="3" cy="-4" r="1.2" fill="#667EEA"/>
    <circle cx="-3" cy="-4" r="0.6" fill="white"/>
    <circle cx="3" cy="-4" r="0.6" fill="white"/>
    
    <!-- Cat nose -->
    <path d="M0 -1 L-1 0 L1 0 Z" fill="#FF6B9D"/>
    
    <!-- Cat mouth -->
    <path d="M0 0 Q-2 2 -3 1 M0 0 Q2 2 3 1" fill="none" stroke="#667EEA" stroke-width="1" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <line x1="-8" y1="-2" x2="-5" y2="-3" stroke="white" stroke-width="1" opacity="0.8"/>
    <line x1="-8" y1="0" x2="-5" y2="-1" stroke="white" stroke-width="1" opacity="0.8"/>
    <line x1="5" y1="-3" x2="8" y2="-2" stroke="white" stroke-width="1" opacity="0.8"/>
    <line x1="5" y1="-1" x2="8" y2="0" stroke="white" stroke-width="1" opacity="0.8"/>
    
    <!-- Cat body (simplified) -->
    <ellipse cx="0" cy="8" rx="6" ry="4" fill="white" opacity="0.9"/>
    
    <!-- Tech elements - small circuit dots -->
    <circle cx="-12" cy="0" r="1" fill="#4FACFE" opacity="0.6"/>
    <circle cx="12" cy="0" r="1" fill="#4FACFE" opacity="0.6"/>
    <circle cx="0" cy="-15" r="1" fill="#4FACFE" opacity="0.6"/>
    <circle cx="0" cy="15" r="1" fill="#4FACFE" opacity="0.6"/>
  </g>
</svg>