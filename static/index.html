<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Emotion Recognition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
            animation: fadeInUp 0.8s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        h1 { color: #333; margin-bottom: 0.5rem; font-size: 2rem; }
        .subtitle { color: #666; margin-bottom: 2rem; font-size: 1.1rem; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .hidden { display: none; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #333; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1rem;
        }
        .upload-area {
            border: 3px dashed #dee2e6;
            border-radius: 10px;
            padding: 2rem;
            margin: 1rem 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        .result {
            margin-top: 1rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        .loading {
            display: none;
            margin: 1rem 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🐱</div>
        <h1>Cat Emotion Recognition</h1>
        <p class="subtitle">AI-powered emotion detection from cat sounds and images</p>
        
        <div id="authSection">
            <button class="btn btn-primary" onclick="showLogin()">Login</button>
            <button class="btn btn-primary" onclick="showRegister()">Register</button>
            
            <div id="loginForm" class="hidden">
                <h3>Login</h3>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword">
                </div>
                <button class="btn btn-primary" onclick="login()">Login</button>
            </div>
            
            <div id="registerForm" class="hidden">
                <h3>Register</h3>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="registerUsername">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="registerPassword">
                </div>
                <button class="btn btn-primary" onclick="register()">Register</button>
            </div>
        </div>
        
        <div id="predictionSection" class="hidden">
            <h3>Choose Prediction Type</h3>
            <button class="btn btn-primary" onclick="showAudioUpload()">
                <i class="fas fa-microphone"></i> Audio Prediction
            </button>
            <button class="btn btn-primary" onclick="showImageUpload()">
                <i class="fas fa-image"></i> Image Prediction
            </button>
            
            <div id="audioUpload" class="hidden">
                <div class="upload-area" onclick="document.getElementById('audioFile').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #667eea;"></i>
                    <p>Upload Cat Audio (MP3, WAV)</p>
                </div>
                <input type="file" id="audioFile" style="display:none" accept="audio/*" onchange="predictAudio()">
            </div>
            
            <div id="imageUpload" class="hidden">
                <div class="upload-area" onclick="document.getElementById('imageFile').click()">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 2rem; color: #667eea;"></i>
                    <p>Upload Cat Image (JPG, PNG)</p>
                </div>
                <input type="file" id="imageFile" style="display:none" accept="image/*" onchange="predictImage()">
            </div>
            
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Analyzing emotion...</p>
            </div>
            
            <div id="result" class="result">
                <div id="emotionResult"></div>
                <div id="confidenceResult"></div>
            </div>
            
            <button class="btn btn-primary" onclick="logout()">Logout</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let authToken = localStorage.getItem('authToken');

        if (authToken) showPredictionSection();

        function showMessage(text, isError = true) {
            document.getElementById('message').innerHTML = 
                `<div style="color: ${isError ? 'red' : 'green'}; margin: 1rem 0;">${text}</div>`;
        }

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');
        }

        function showAudioUpload() {
            document.getElementById('audioUpload').classList.remove('hidden');
            document.getElementById('imageUpload').classList.add('hidden');
        }

        function showImageUpload() {
            document.getElementById('imageUpload').classList.remove('hidden');
            document.getElementById('audioUpload').classList.add('hidden');
        }

        function showPredictionSection() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('predictionSection').classList.remove('hidden');
        }

        async function register() {
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                if (response.ok) {
                    showMessage('Registration successful! Please login.', false);
                    showLogin();
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Registration failed');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message);
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    authToken = data.access_token;
                    localStorage.setItem('authToken', authToken);
                    showPredictionSection();
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Login failed');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message);
            }
        }

        async function predictAudio() {
            const fileInput = document.getElementById('audioFile');
            const file = fileInput.files[0];
            if (!file) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            const formData = new FormData();
            formData.append('audio_file', file);

            try {
                const response = await fetch(`${API_BASE}/predict/audio`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    displayResult(data);
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Prediction failed');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function predictImage() {
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];
            if (!file) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            const formData = new FormData();
            formData.append('image_file', file);

            try {
                const response = await fetch(`${API_BASE}/predict/image`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    displayResult(data);
                } else {
                    const error = await response.json();
                    showMessage(error.detail || 'Prediction failed');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function displayResult(data) {
            document.getElementById('emotionResult').innerHTML = 
                `<strong>Predicted Emotion: ${data.predicted_emotion}</strong>`;
            document.getElementById('confidenceResult').innerHTML = 
                `Confidence: ${data.confidence}`;
            document.getElementById('result').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('authToken');
            authToken = null;
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('predictionSection').classList.add('hidden');
        }
    </script>
</body>
</html>
