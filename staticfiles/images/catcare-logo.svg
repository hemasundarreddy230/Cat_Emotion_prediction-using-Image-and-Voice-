<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the cat -->
    <linearGradient id="catGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FACFE;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#667EEA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764BA2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cat silhouette with tech elements -->
  <g transform="translate(10, 10)">
    <!-- Cat body -->
    <path d="M20 35 Q15 30 15 25 Q15 20 20 18 Q25 15 30 18 Q35 20 35 25 Q35 30 30 35 Q25 38 20 35 Z" 
          fill="url(#catGradient)" stroke="#4FACFE" stroke-width="1" filter="url(#glow)"/>
    
    <!-- Cat head -->
    <circle cx="25" cy="20" r="8" fill="url(#catGradient)" stroke="#4FACFE" stroke-width="1"/>
    
    <!-- Cat ears -->
    <path d="M18 15 L20 10 L22 15 Z" fill="url(#catGradient)" stroke="#4FACFE" stroke-width="1"/>
    <path d="M28 15 L30 10 L32 15 Z" fill="url(#catGradient)" stroke="#4FACFE" stroke-width="1"/>
    
    <!-- Cat eyes -->
    <circle cx="22" cy="18" r="1.5" fill="white"/>
    <circle cx="28" cy="18" r="1.5" fill="white"/>
    <circle cx="22" cy="18" r="0.8" fill="#667EEA"/>
    <circle cx="28" cy="18" r="0.8" fill="#667EEA"/>
    
    <!-- Cat nose -->
    <path d="M25 21 L24 22 L26 22 Z" fill="#FF6B9D"/>
    
    <!-- Whiskers -->
    <line x1="15" y1="20" x2="19" y2="19" stroke="#4FACFE" stroke-width="1"/>
    <line x1="15" y1="22" x2="19" y2="21" stroke="#4FACFE" stroke-width="1"/>
    <line x1="31" y1="19" x2="35" y2="20" stroke="#4FACFE" stroke-width="1"/>
    <line x1="31" y1="21" x2="35" y2="22" stroke="#4FACFE" stroke-width="1"/>
    
    <!-- Cat tail -->
    <path d="M30 35 Q35 40 32 45 Q30 42 28 40" fill="none" stroke="url(#catGradient)" stroke-width="2"/>
    
    <!-- Tech elements - circuit lines -->
    <g opacity="0.7">
      <line x1="5" y1="25" x2="12" y2="25" stroke="#4FACFE" stroke-width="1"/>
      <line x1="38" y1="25" x2="45" y2="25" stroke="#4FACFE" stroke-width="1"/>
      <circle cx="5" cy="25" r="2" fill="#4FACFE"/>
      <circle cx="45" cy="25" r="2" fill="#4FACFE"/>
      
      <!-- Vertical tech lines -->
      <line x1="25" y1="5" x2="25" y2="12" stroke="#4FACFE" stroke-width="1"/>
      <line x1="25" y1="38" x2="25" y2="45" stroke="#4FACFE" stroke-width="1"/>
      <circle cx="25" cy="5" r="2" fill="#4FACFE"/>
      <circle cx="25" cy="45" r="2" fill="#4FACFE"/>
    </g>
  </g>
  
  <!-- CatCare AI Text -->
  <text x="70" y="25" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" fill="white">
    CatCare
  </text>
  <text x="140" y="25" font-family="'Poppins', sans-serif" font-size="18" font-weight="700" fill="#4FACFE">
    AI
  </text>
  
  <!-- Subtitle -->
  <text x="70" y="40" font-family="'Inter', sans-serif" font-size="10" font-weight="400" fill="#B0BEC5" opacity="0.8">
    Professional Pet Care
  </text>
</svg>